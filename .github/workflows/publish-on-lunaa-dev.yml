name: Publish API to External Maven Repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: Build API and Javadoc
        run: ./gradlew :api:publish :api:javadoc -Pversion=$VERSION

      - name: Copy Javadoc HTML to Maven Repository folder
        run: |
          mkdir -p build/gh-pages-repo/dev/lunaa/moonbreak/moonbreak-api/$VERSION/javadoc
          cp -r api/build/docs/javadoc/* build/gh-pages-repo/dev/lunaa/moonbreak/moonbreak-api/$VERSION/javadoc/

      - name: Deploy to Github Pages Repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.LUNAA_DEV_SITE_TOKEN }}
          external_repository: LunaHD24/lunaa-dev-site
          publish_branch: main
          publish_dir: ./build/gh-pages-repo
          destination_dir: repository/maven
          keep_files: true
