name: Publish API to External Maven Repository

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Publish API Locally
        run: ./gradlew :api:publish

      - name: Deploy to Github Pages Repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.LUNAA_DEV_SITE_TOKEN }}
          external_repository: LunaHD24/lunaa-dev-site
          publish_branch: main
          publish_dir: ./build/gh-pages-repo
          destination_dir: repository/maven
          keep_files: true
